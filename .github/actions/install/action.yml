name: "install kuori"
description: "install kuori"

inputs:
  ssh-private-key:
    description: "SSH private key content written to ~/.ssh/id_ed25519"
    required: false
    default: ""
  ssh-host-name:
    description: "SSH HostName"
    required: false
    default: ""
  ssh-user:
    description: "SSH User"
    required: false
    default: ""
  ssh-host-alias:
    description: "SSH Host alias used by kuori task.host"
    required: false
    default: "target"
  ssh-port:
    description: "SSH Port"
    required: false
    default: "22"
  ssh-known-hosts:
    description: "Verified known_hosts entries for the SSH server"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Download latest kuori binary using gh CLI
      shell: bash
      run: |
        gh release download --repo wim-web/kuori --pattern 'kuori-linux-amd64'

        mkdir -p ${{ github.workspace }}/bin
        mv kuori-linux-amd64 ${{ github.workspace }}/bin/kuori
        chmod +x ${{ github.workspace }}/bin/kuori
        echo ${{ github.workspace }}/bin >> $GITHUB_PATH
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Validate SSH inputs
      if: ${{ inputs.ssh-private-key != '' || inputs.ssh-host-name != '' || inputs.ssh-user != '' }}
      shell: bash
      env:
        SSH_PRIVATE_KEY: ${{ inputs.ssh-private-key }}
        SSH_HOST_NAME: ${{ inputs.ssh-host-name }}
        SSH_USER: ${{ inputs.ssh-user }}
        SSH_KNOWN_HOSTS: ${{ inputs.ssh-known-hosts }}
      run: |
        if [ -z "$SSH_PRIVATE_KEY" ]; then
          echo "ssh-private-key is required when SSH config is requested" >&2
          exit 1
        fi
        if [ -z "$SSH_HOST_NAME" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_KNOWN_HOSTS" ]; then
          echo "ssh-host-name, ssh-user and ssh-known-hosts are required when ssh-private-key is set" >&2
          exit 1
        fi

    - name: Prepare ~/.ssh
      if: ${{ inputs.ssh-private-key != '' }}
      shell: bash
      run: |
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh

    - name: Install private key
      if: ${{ inputs.ssh-private-key != '' }}
      shell: bash
      env:
        SSH_PRIVATE_KEY: ${{ inputs.ssh-private-key }}
        SSH_KNOWN_HOSTS: ${{ inputs.ssh-known-hosts }}
      run: |
        umask 077
        printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
        printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
        chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

    - name: Install ssh config
      if: ${{ inputs.ssh-private-key != '' }}
      shell: bash
      env:
        SSH_HOST_ALIAS: ${{ inputs.ssh-host-alias }}
        SSH_HOST_NAME: ${{ inputs.ssh-host-name }}
        SSH_USER: ${{ inputs.ssh-user }}
        SSH_PORT: ${{ inputs.ssh-port }}
      run: |
        cat > ~/.ssh/config <<EOF
        Host ${SSH_HOST_ALIAS}
          HostName ${SSH_HOST_NAME}
          User ${SSH_USER}
          Port ${SSH_PORT}
          IdentityFile ~/.ssh/id_ed25519
        EOF
        chmod 600 ~/.ssh/config
